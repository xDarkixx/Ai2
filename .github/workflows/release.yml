name: Ai2 Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Ubuntu release validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate application
        run: |
          npm install
          npm run check
          python3 -m py_compile wan22/runner.py
          sudo apt-get update
          sudo apt-get install -y cmake build-essential
          cmake -S native -B build
          cmake --build build --config Release
          printf '%s\n' '{"op":"ping"}' | ./build/ai2_native --bridge
      - name: Build release archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release/Ai2-${VERSION}
          rsync -a --exclude='.git' --exclude='node_modules' --exclude='build' ./ release/Ai2-${VERSION}/
          tar -czf "Ai2-${VERSION}-ubuntu.tar.gz" -C release "Ai2-${VERSION}"
          sha256sum "Ai2-${VERSION}-ubuntu.tar.gz" > "Ai2-${VERSION}-ubuntu.tar.gz.sha256"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Ai2-*-ubuntu.tar.gz
            Ai2-*-ubuntu.tar.gz.sha256
