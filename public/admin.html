<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ai2 — Admin</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/admin.css">
</head>
<body class="admin-body">
<div class="admin-shell">
<header class="admin-topbar"><div class="brand"><span class="brand-mark">✦</span><span>Ai2</span><span class="brand-badge">ADMIN</span></div><div class="admin-actions"><button id="refreshBtn">↻ Aktualisieren</button><a href="/">← Zur App</a></div></header>
<main class="admin-main">
<section class="admin-hero"><div><span class="eyebrow">CONTROL CENTER</span><h1>Admin Dashboard</h1><p>Verwalte Ai2, Charaktere, Medien und deine KI-Dienste in einer Oberfläche.</p></div><div class="system-pill"><i></i><span id="systemStatus">Prüfe System…</span></div></section>
<section class="stat-grid" id="stats"></section>
<section class="admin-grid">
<div class="admin-card wide"><div class="card-head"><div><span class="eyebrow">PLATTFORM</span><h2>System & KI</h2></div></div><div class="system-grid" id="systemGrid"></div></div>
<div class="admin-card"><div class="card-head"><div><span class="eyebrow">CHARAKTERE</span><h2>Charakterverwaltung</h2></div></div><form id="charForm" class="admin-form"><input name="name" required placeholder="Name"><input name="tagline" placeholder="Kurzbeschreibung"><input name="emoji" value="💫" maxlength="4" placeholder="Emoji"><textarea name="personality" placeholder="Persönlichkeit"></textarea><textarea name="appearance" placeholder="Aussehen / Stil"></textarea><button>＋ Charakter anlegen</button></form><div id="characterTable" class="admin-list"></div></div>
<div class="admin-card"><div class="card-head"><div><span class="eyebrow">MEDIA</span><h2>Video-Aufträge</h2></div></div><div id="mediaTable" class="admin-list"></div></div>
<div class="admin-card wide"><div class="card-head"><div><span class="eyebrow">DATEN</span><h2>Aktivität</h2></div></div><div class="activity-grid"><button id="loadChats">Chats laden</button><button id="loadCollection">Sammlung laden</button><div id="activityOutput" class="activity-output">Bereit.</div></div></div>
</section>
</main>
</div><script src="/admin.js"></script>
</body></html>
