<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ai2 — Zahlungen</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/admin.css"></head><body class="admin-body"><div class="admin-shell"><header class="admin-topbar"><div class="brand"><span class="brand-mark">✦</span><span>Ai2</span><span class="brand-badge">PAYMENTS</span></div><div class="admin-actions"><button id="refresh">↻ Aktualisieren</button><a href="/admin.html">← Admin</a></div></header><main class="admin-main"><section class="admin-hero"><div><span class="eyebrow">BILLING CONTROL</span><h1>Zahlungen & Rückerstattungen</h1><p>Bezahlstatus, fehlgeschlagene Zahlungen, Abos und Rückerstattungen überwachen.</p></div><div class="system-pill"><i></i><span id="state">Nicht verbunden</span></div></section><section class="stat-grid" id="stats"></section><section class="admin-card wide"><div class="card-head"><div><span class="eyebrow">TRANSAKTIONEN</span><h2>Zahlungs-Log</h2><p>Die neuesten 500 Zahlungs- und Refund-Ereignisse.</p></div></div><div id="table" class="admin-list"></div></section></main></div><script>
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const headers=()=>{const t=sessionStorage.getItem('ai2AdminToken')||'';return t?{'x-ai2-admin-token':t}:{};};async function api(u,o={}){const r=await fetch('http://'+location.hostname+':3020'+u,{headers:{'content-type':'application/json',...headers(),...(o.headers||{})},...o});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d;}function eur(c){return c==null?'—':(Number(c)/100).toLocaleString('de-DE',{style:'currency',currency:'EUR'});}async function load(){try{const[s,t]=await Promise.all([api('/api/payments/admin/summary'),api('/api/payments/admin/transactions')]);$('#state').textContent='Payment-Service online';$('#stats').innerHTML=[['Kunden',s.customers],['Zahlungen',s.payments],['Bezahlt',s.paid],['Fehlgeschlagen',s.failed],['Rückerstattungen',s.refunded],['Aktive Abos',s.active]].map(x=>`<div class="stat-card"><div class="stat-label">${esc(x[0])}</div><div class="stat-value">${esc(x[1])}</div></div>`).join('');$('#table').innerHTML=t.transactions.length?t.transactions.map(x=>{const refund=x.kind==='refund';return `<div class="admin-row"><div><strong>${refund?'↩ Rückerstattung':'€ Zahlung'} · ${esc(x.userId||'unbekannt')}</strong><small>${esc(x.status||'')} · ${esc(x.planId||'')} · ${esc(x.createdAt||'')} · ${eur(x.amount??x.amountPaid??x.amountTotal)}</small></div>${!refund&&x.paymentIntentId?`<button type="button" data-refund="${esc(x.id)}">Rückerstatten</button>`:''}</div>`}).join(''):'<div class="empty">Noch keine Zahlungsereignisse.</div>';}catch(e){$('#state').textContent='Fehler: '+e.message;$('#table').textContent=e.message;}}$('#refresh').onclick=load;$('#table').onclick=async e=>{const b=e.target.closest('[data-refund]');if(!b)return;const id=b.dataset.refund;if(!confirm('Diese Zahlung vollständig zurückerstatten?'))return;try{await api('/api/payments/admin/refund',{method:'POST',body:JSON.stringify({paymentId:id,reason:'requested_by_customer'})});await load();}catch(err){alert(err.message)}};load();
</script></body></html>
